<svg width="1200" height="24" viewBox="0 0 1200 24" xmlns="http://www.w3.org/2000/svg">

  <!-- Pure black -->
  <rect width="1200" height="24" fill="#040404"/>

  <!-- Main divider line -->
  <line x1="0"   y1="12" x2="568" y2="12" stroke="#3c3c3c" stroke-width="1.3"/>
  <line x1="632" y1="12" x2="1200" y2="12" stroke="#3c3c3c" stroke-width="1.3"/>

  <!-- Secondary thin rule (double-line effect above) -->
  <line x1="0"   y1="9"  x2="556" y2="9"  stroke="#212121" stroke-width="0.6"/>
  <line x1="644" y1="9"  x2="1200" y2="9"  stroke="#212121" stroke-width="0.6"/>

  <!-- ══ CENTER ORNAMENT — large diamond ══ -->
  <polygon points="600,2 630,12 600,22 570,12"
           fill="#040404" stroke="#4c4c4c" stroke-width="1.6"/>
  <!-- Inner diamond -->
  <polygon points="600,5.5 622,12 600,18.5 578,12"
           fill="none" stroke="#272727" stroke-width="0.9"/>

  <!-- Scythe inside diamond -->
  <line x1="600" y1="6"  x2="600" y2="19"
        stroke="#4e4e4e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="595" y1="19" x2="605" y2="19"
        stroke="#424242" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M600,6 Q618,5 619,12 Q620,17 609,19 Q602,19.5 600.5,15.5"
        fill="none" stroke="#787878" stroke-width="2" stroke-linecap="round"/>
  <circle cx="600" cy="6" r="2.2" fill="none" stroke="#646464" stroke-width="1.2"/>

  <!-- Flanking dots -->
  <circle cx="550" cy="12" r="2.2" fill="#303030"/>
  <circle cx="650" cy="12" r="2.2" fill="#303030"/>
  <circle cx="528" cy="12" r="1.3" fill="#222222"/>
  <circle cx="672" cy="12" r="1.3" fill="#222222"/>

</svg>
