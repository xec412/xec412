<svg width="1200" height="80" viewBox="0 0 1200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.4" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pure black -->
  <rect width="1200" height="80" fill="#040404"/>
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#1c1c1c" stroke-width="1.2"/>

  <!-- ══ LEFT BOX ══ -->
  <rect x="10" y="11" width="96" height="54" fill="none" stroke="#505050" stroke-width="1.5"/>
  <!-- Corner ticks -->
  <line x1="10"  y1="11" x2="29"  y2="11" stroke="#767676" stroke-width="2.6"/>
  <line x1="10"  y1="11" x2="10"  y2="30" stroke="#767676" stroke-width="2.6"/>
  <line x1="106" y1="11" x2="87"  y2="11" stroke="#767676" stroke-width="2.6"/>
  <line x1="106" y1="11" x2="106" y2="30" stroke="#767676" stroke-width="2.6"/>
  <line x1="10"  y1="65" x2="29"  y2="65" stroke="#767676" stroke-width="2.6"/>
  <line x1="10"  y1="65" x2="10"  y2="46" stroke="#767676" stroke-width="2.6"/>
  <line x1="106" y1="65" x2="87"  y2="65" stroke="#767676" stroke-width="2.6"/>
  <line x1="106" y1="65" x2="106" y2="46" stroke="#767676" stroke-width="2.6"/>
  <!-- Left scythe — handle -->
  <line x1="37" y1="16" x2="37" y2="62"
        stroke="#5c5c5c" stroke-width="3" stroke-linecap="round"/>
  <!-- Handle foot -->
  <line x1="29" y1="62" x2="45" y2="62"
        stroke="#505050" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Blade sweeping right, fills box -->
  <path d="M37,16 Q96,10 100,36 Q102,54 70,62 Q50,65 40,55"
        fill="none" stroke="#969696" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ring -->
  <circle cx="37" cy="16" r="3.8" fill="none" stroke="#787878" stroke-width="2"/>

  <!-- ══ RIGHT BOX ══ -->
  <rect x="1094" y="11" width="96" height="54" fill="none" stroke="#505050" stroke-width="1.5"/>
  <line x1="1094" y1="11" x2="1113" y2="11" stroke="#767676" stroke-width="2.6"/>
  <line x1="1094" y1="11" x2="1094" y2="30" stroke="#767676" stroke-width="2.6"/>
  <line x1="1190" y1="11" x2="1171" y2="11" stroke="#767676" stroke-width="2.6"/>
  <line x1="1190" y1="11" x2="1190" y2="30" stroke="#767676" stroke-width="2.6"/>
  <line x1="1094" y1="65" x2="1113" y2="65" stroke="#767676" stroke-width="2.6"/>
  <line x1="1094" y1="65" x2="1094" y2="46" stroke="#767676" stroke-width="2.6"/>
  <line x1="1190" y1="65" x2="1171" y2="65" stroke="#767676" stroke-width="2.6"/>
  <line x1="1190" y1="65" x2="1190" y2="46" stroke="#767676" stroke-width="2.6"/>
  <!-- Right scythe (mirror — blade sweeps LEFT) -->
  <line x1="1163" y1="16" x2="1163" y2="62"
        stroke="#5c5c5c" stroke-width="3" stroke-linecap="round"/>
  <line x1="1155" y1="62" x2="1171" y2="62"
        stroke="#505050" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M1163,16 Q1104,10 1100,36 Q1098,54 1130,62 Q1150,65 1160,55"
        fill="none" stroke="#969696" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1163" cy="16" r="3.8" fill="none" stroke="#787878" stroke-width="2"/>

  <!-- ══ MAIN TEXT ══ -->
  <text x="600" y="42"
        text-anchor="middle"
        font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif"
        font-size="13.5"
        letter-spacing="4.5"
        fill="#ccc8b4"
        filter="url(#glow)">WINDOWS INTERNALS · MALWARE DEVELOPMENT · OFFENSIVE-TOOLING</text>

  <!-- ══ BOTTOM DIVIDER ══ -->
  <line x1="10"  y1="73" x2="572" y2="73" stroke="#3a3a3a" stroke-width="1.3"/>
  <line x1="628" y1="73" x2="1190" y2="73" stroke="#3a3a3a" stroke-width="1.3"/>

  <!-- Center diamond -->
  <polygon points="600,66 626,73 600,80 574,73"
           fill="#040404" stroke="#484848" stroke-width="1.6"/>
  <line x1="600" y1="69" x2="600" y2="77" stroke="#585858" stroke-width="1.1"/>
  <line x1="590" y1="73" x2="610" y2="73" stroke="#3c3c3c" stroke-width="1.1" stroke-dasharray="3,2.5"/>

  <!-- Flanking sickle arcs -->
  <path d="M572,73 Q562,63 574,62 Q584,62 585,73"
        fill="none" stroke="#404040" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M628,73 Q638,63 626,62 Q616,62 615,73"
        fill="none" stroke="#404040" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="0" y1="79.5" x2="1200" y2="79.5" stroke="#161616" stroke-width="1"/>
</svg>
