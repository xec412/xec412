<svg width="900" height="56" viewBox="0 0 900 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d0508" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#160610" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#1c0a12" stop-opacity="1"/>
      <stop offset="85%"  stop-color="#160610" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0508" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c0293e" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#c0293e" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#ff3355" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#c0293e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c0293e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background panel -->
  <rect x="0" y="4" width="900" height="48" fill="url(#bg)" rx="2"/>

  <!-- top border -->
  <rect x="0" y="4"  width="900" height="1" fill="url(#border)" opacity="0.9"/>
  <!-- bottom border -->
  <rect x="0" y="51" width="900" height="1" fill="url(#border)" opacity="0.9"/>

  <!-- left accent bar -->
  <rect x="80" y="4" width="2" height="48" fill="#c0293e" opacity="0.6"/>
  <!-- right accent bar -->
  <rect x="818" y="4" width="2" height="48" fill="#c0293e" opacity="0.6"/>

  <!-- left butterfly ornament -->
  <g transform="translate(56,28)" opacity="0.8" filter="url(#glow)">
    <ellipse cx="-9" cy="-5" rx="8" ry="4" fill="#c0293e" transform="rotate(-25,-9,-5)"/>
    <ellipse cx="-9" cy="5"  rx="6" ry="3" fill="#7b1a2a" transform="rotate(25,-9,5)"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ff8899" stroke-width="0.9"/>
  </g>

  <!-- right butterfly ornament (mirrored) -->
  <g transform="translate(844,28) scale(-1,1)" opacity="0.8" filter="url(#glow)">
    <ellipse cx="-9" cy="-5" rx="8" ry="4" fill="#c0293e" transform="rotate(-25,-9,-5)"/>
    <ellipse cx="-9" cy="5"  rx="6" ry="3" fill="#7b1a2a" transform="rotate(25,-9,5)"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ff8899" stroke-width="0.9"/>
  </g>

  <!-- subtitle text — edit as needed -->
  <text x="450" y="34"
        font-family="'Georgia', 'Palatino Linotype', serif"
        font-size="18"
        font-weight="400"
        letter-spacing="6"
        text-anchor="middle"
        fill="#e8c0c8"
        filter="url(#glow)">SUBTITLE TEXT HERE</text>
</svg>
