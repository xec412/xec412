<svg width="900" height="32" viewBox="0 0 900 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d0508" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#7b1a2a" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#c0293e" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#7b1a2a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d0508" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d0508" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#ff3355" stop-opacity="0.12"/>
      <stop offset="50%"  stop-color="#ff3355" stop-opacity="0.22"/>
      <stop offset="80%"  stop-color="#ff3355" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d0508" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- glow layer -->
  <rect x="0" y="11" width="900" height="10" fill="url(#glow)" rx="5"/>
  <!-- main line -->
  <rect x="0" y="15" width="900" height="2" fill="url(#lg)" rx="1"/>

  <!-- center diamond -->
  <polygon points="450,10 456,16 450,22 444,16" fill="#c0293e" opacity="0.95"/>
  <polygon points="450,12 454,16 450,20 446,16" fill="#ff6680" opacity="0.7"/>

  <!-- left butterfly -->
  <g transform="translate(395,16)" opacity="0.75">
    <ellipse cx="-8" cy="-4" rx="7" ry="3.5" fill="#c0293e" transform="rotate(-20,-8,-4)"/>
    <ellipse cx="-8" cy="4"  rx="5" ry="2.5" fill="#7b1a2a" transform="rotate(20,-8,4)"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#ff6680" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- right butterfly (mirrored) -->
  <g transform="translate(505,16) scale(-1,1)" opacity="0.75">
    <ellipse cx="-8" cy="-4" rx="7" ry="3.5" fill="#c0293e" transform="rotate(-20,-8,-4)"/>
    <ellipse cx="-8" cy="4"  rx="5" ry="2.5" fill="#7b1a2a" transform="rotate(20,-8,4)"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#ff6680" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- left small dots -->
  <circle cx="340" cy="16" r="1.5" fill="#c0293e" opacity="0.6"/>
  <circle cx="360" cy="16" r="1"   fill="#c0293e" opacity="0.4"/>
  <!-- right small dots -->
  <circle cx="560" cy="16" r="1.5" fill="#c0293e" opacity="0.6"/>
  <circle cx="540" cy="16" r="1"   fill="#c0293e" opacity="0.4"/>
</svg>
