<svg width="1200" height="68" viewBox="0 0 1200 68" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pure black background -->
  <rect width="1200" height="68" fill="#020202"/>

  <!-- Top hairline border -->
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#181818" stroke-width="1"/>

  <!-- ══ LEFT BOX ══ -->
  <rect x="10" y="6" width="66" height="42" fill="none" stroke="#1f1f1f" stroke-width="0.9"/>
  <!-- Corner accent ticks — top-left -->
  <line x1="10"  y1="6"  x2="26"  y2="6"  stroke="#3e3e3e" stroke-width="1.8"/>
  <line x1="10"  y1="6"  x2="10"  y2="22" stroke="#3e3e3e" stroke-width="1.8"/>
  <!-- Corner accent ticks — top-right -->
  <line x1="76"  y1="6"  x2="60"  y2="6"  stroke="#3e3e3e" stroke-width="1.8"/>
  <line x1="76"  y1="6"  x2="76"  y2="22" stroke="#3e3e3e" stroke-width="1.8"/>
  <!-- Corner accent ticks — bottom-left -->
  <line x1="10"  y1="48" x2="26"  y2="48" stroke="#3e3e3e" stroke-width="1.8"/>
  <line x1="10"  y1="48" x2="10"  y2="32" stroke="#3e3e3e" stroke-width="1.8"/>
  <!-- Corner accent ticks — bottom-right -->
  <line x1="76"  y1="48" x2="60"  y2="48" stroke="#3e3e3e" stroke-width="1.8"/>
  <line x1="76"  y1="48" x2="76"  y2="32" stroke="#3e3e3e" stroke-width="1.8"/>

  <!-- Left scythe — handle -->
  <line x1="36" y1="12" x2="36" y2="42" stroke="#3e3e3e" stroke-width="1.1"/>
  <!-- Handle foot -->
  <line x1="30" y1="42" x2="42" y2="42" stroke="#353535" stroke-width="1"/>
  <!-- Blade arcing right from handle top -->
  <path d="M36,12 Q70,9 72,24 Q73,36 52,38 Q40,39 37,31"
        fill="none" stroke="#6c6c6c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ring at blade–handle join -->
  <circle cx="36" cy="12" r="2.2" fill="none" stroke="#525252" stroke-width="1"/>

  <!-- ══ RIGHT BOX (mirror) ══ -->
  <rect x="1124" y="6" width="66" height="42" fill="none" stroke="#1f1f1f" stroke-width="0.9"/>
  <!-- Corner ticks — top-left -->
  <line x1="1124" y1="6"  x2="1140" y2="6"  stroke="#3e3e3e" stroke-width="1.8"/>
  <line x1="1124" y1="6"  x2="1124" y2="22" stroke="#3e3e3e" stroke-width="1.8"/>
  <!-- Corner ticks — top-right -->
  <line x1="1190" y1="6"  x2="1174" y2="6"  stroke="#3e3e3e" stroke-width="1.8"/>
  <line x1="1190" y1="6"  x2="1190" y2="22" stroke="#3e3e3e" stroke-width="1.8"/>
  <!-- Corner ticks — bottom-left -->
  <line x1="1124" y1="48" x2="1140" y2="48" stroke="#3e3e3e" stroke-width="1.8"/>
  <line x1="1124" y1="48" x2="1124" y2="32" stroke="#3e3e3e" stroke-width="1.8"/>
  <!-- Corner ticks — bottom-right -->
  <line x1="1190" y1="48" x2="1174" y2="48" stroke="#3e3e3e" stroke-width="1.8"/>
  <line x1="1190" y1="48" x2="1190" y2="32" stroke="#3e3e3e" stroke-width="1.8"/>

  <!-- Right scythe — handle (mirrored) -->
  <line x1="1164" y1="12" x2="1164" y2="42" stroke="#3e3e3e" stroke-width="1.1"/>
  <line x1="1158" y1="42" x2="1170" y2="42" stroke="#353535" stroke-width="1"/>
  <!-- Blade arcing LEFT from handle top -->
  <path d="M1164,12 Q1130,9 1128,24 Q1127,36 1148,38 Q1160,39 1163,31"
        fill="none" stroke="#6c6c6c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1164" cy="12" r="2.2" fill="none" stroke="#525252" stroke-width="1"/>

  <!-- ══ MAIN TEXT ══ -->
  <text x="600" y="31"
        text-anchor="middle"
        font-family="'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif"
        font-size="10.5"
        font-weight="400"
        letter-spacing="4"
        fill="#b8b4a2"
        filter="url(#glow)">WINDOWS INTERNALS · MALWARE DEVELOPMENT · OFFENSIVE-TOOLING</text>

  <!-- ══ DIVIDER LINE (bottom of subtitle box) ══ -->
  <line x1="10"  y1="58" x2="568" y2="58" stroke="#1c1c1c" stroke-width="0.9"/>
  <line x1="632" y1="58" x2="1190" y2="58" stroke="#1c1c1c" stroke-width="0.9"/>

  <!-- Secondary thin line above divider -->
  <line x1="84"  y1="55.5" x2="558" y2="55.5" stroke="#131313" stroke-width="0.5"/>
  <line x1="642" y1="55.5" x2="1116" y2="55.5" stroke="#131313" stroke-width="0.5"/>

  <!-- Center diamond ornament on divider -->
  <polygon points="600,51 620,58 600,65 580,58" fill="#020202" stroke="#2e2e2e" stroke-width="1"/>
  <!-- Inner mark -->
  <polygon points="600,53.5 613,58 600,62.5 587,58" fill="none" stroke="#1e1e1e" stroke-width="0.6"/>
  <!-- Inner cross lines -->
  <line x1="600" y1="53.5" x2="600" y2="62.5" stroke="#444444" stroke-width="0.8"/>
  <line x1="589" y1="58"   x2="611" y2="58"   stroke="#2a2a2a" stroke-width="0.8" stroke-dasharray="2.5,2"/>

  <!-- Flanking sickle arcs on divider -->
  <path d="M570,58 Q562,50 572,49 Q580,49 581,58"
        fill="none" stroke="#303030" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M630,58 Q638,50 628,49 Q620,49 619,58"
        fill="none" stroke="#303030" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Bottom hairline -->
  <line x1="0" y1="67.5" x2="1200" y2="67.5" stroke="#141414" stroke-width="1"/>
</svg>
