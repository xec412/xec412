        font-weight="700"
        letter-spacing="5"
        fill="#eeeeee">MALWARE DEVELOPER <tspan fill="#686868" letter-spacing="0">&#9670;</tspan> WINDOWS INTERNALS <tspan fill="#686868" letter-spacing="0">&#9670;</tspan> LOW-LEVEL ENGINEER</text>
