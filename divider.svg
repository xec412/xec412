<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60">
  <defs>
    <linearGradient id="mL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#4a2535" stop-opacity="0"/>
      <stop offset="12%" stop-color="#4a2535" stop-opacity="0.7"/>
      <stop offset="38%" stop-color="#5a2f40" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="mR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="62%" stop-color="#5a2f40" stop-opacity="1"/>
      <stop offset="88%" stop-color="#4a2535" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4a2535" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#3a1f2c" stop-opacity="0"/>
      <stop offset="12%" stop-color="#3a1f2c" stop-opacity="0.5"/>
      <stop offset="38%" stop-color="#3a1f2c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="62%" stop-color="#3a1f2c" stop-opacity="0.9"/>
      <stop offset="88%" stop-color="#3a1f2c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3a1f2c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- TOP thin track -->
  <line x1="0" y1="18" x2="554" y2="18" stroke="url(#tL)" stroke-width="1"/>
  <line x1="646" y1="18" x2="1200" y2="18" stroke="url(#tR)" stroke-width="1"/>
  <!-- MAIN track -->
  <line x1="0" y1="30" x2="546" y2="30" stroke="url(#mL)" stroke-width="2.5"/>
  <line x1="654" y1="30" x2="1200" y2="30" stroke="url(#mR)" stroke-width="2.5"/>
  <!-- BOTTOM thin track -->
  <line x1="0" y1="42" x2="554" y2="42" stroke="url(#tL)" stroke-width="1"/>
  <line x1="646" y1="42" x2="1200" y2="42" stroke="url(#tR)" stroke-width="1"/>

  <!-- LEFT DIAMONDS (large → small) -->
  <!-- x=480 — big -->
  <polygon points="480,23 492,30 480,37 468,30" fill="#6a3548"/>
  <!-- x=360 — medium -->
  <polygon points="360,25 370,30 360,35 350,30" fill="#5a2f40"/>
  <!-- x=240 — small -->
  <polygon points="240,26 248,30 240,34 232,30" fill="#4a2535" opacity="0.95"/>
  <!-- x=120 — tiny -->
  <polygon points="120,27 127,30 120,33 113,30" fill="#3d1f2c" opacity="0.9"/>

  <!-- RIGHT DIAMONDS (mirror) -->
  <polygon points="720,23 732,30 720,37 708,30" fill="#6a3548"/>
  <polygon points="840,25 850,30 840,35 830,30" fill="#5a2f40"/>
  <polygon points="960,26 968,30 960,34 952,30" fill="#4a2535" opacity="0.95"/>
  <polygon points="1080,27 1087,30 1080,33 1073,30" fill="#3d1f2c" opacity="0.9"/>

  <!-- LEFT THORNS — between diamonds, on top track -->
  <line x1="424" y1="13" x2="420" y2="21" stroke="#5a2f40" stroke-width="1.5"/>
  <line x1="436" y1="14" x2="433" y2="21" stroke="#4a2535" stroke-width="1.2"/>
  <line x1="304" y1="13" x2="300" y2="21" stroke="#5a2f40" stroke-width="1.5"/>
  <line x1="316" y1="14" x2="313" y2="21" stroke="#4a2535" stroke-width="1.2"/>
  <line x1="184" y1="14" x2="181" y2="21" stroke="#4a2535" stroke-width="1.3"/>
  <line x1="194" y1="15" x2="192" y2="21" stroke="#3d1f2c" stroke-width="1"/>
  <line x1="64"  y1="15" x2="62"  y2="21" stroke="#3d1f2c" stroke-width="1.2"/>
  <!-- LEFT THORNS — bottom track -->
  <line x1="424" y1="47" x2="420" y2="39" stroke="#5a2f40" stroke-width="1.5"/>
  <line x1="436" y1="46" x2="433" y2="39" stroke="#4a2535" stroke-width="1.2"/>
  <line x1="304" y1="47" x2="300" y2="39" stroke="#5a2f40" stroke-width="1.5"/>
  <line x1="316" y1="46" x2="313" y2="39" stroke="#4a2535" stroke-width="1.2"/>
  <line x1="184" y1="46" x2="181" y2="39" stroke="#4a2535" stroke-width="1.3"/>
  <line x1="64"  y1="45" x2="62"  y2="39" stroke="#3d1f2c" stroke-width="1.2"/>

  <!-- RIGHT THORNS — top track (mirror) -->
  <line x1="776" y1="13" x2="780" y2="21" stroke="#5a2f40" stroke-width="1.5"/>
  <line x1="764" y1="14" x2="767" y2="21" stroke="#4a2535" stroke-width="1.2"/>
  <line x1="896" y1="13" x2="900" y2="21" stroke="#5a2f40" stroke-width="1.5"/>
  <line x1="884" y1="14" x2="887" y2="21" stroke="#4a2535" stroke-width="1.2"/>
  <line x1="1016" y1="14" x2="1019" y2="21" stroke="#4a2535" stroke-width="1.3"/>
  <line x1="1136" y1="15" x2="1138" y2="21" stroke="#3d1f2c" stroke-width="1.2"/>
  <!-- RIGHT THORNS — bottom track -->
  <line x1="776" y1="47" x2="780" y2="39" stroke="#5a2f40" stroke-width="1.5"/>
  <line x1="764" y1="46" x2="767" y2="39" stroke="#4a2535" stroke-width="1.2"/>
  <line x1="896" y1="47" x2="900" y2="39" stroke="#5a2f40" stroke-width="1.5"/>
  <line x1="884" y1="46" x2="887" y2="39" stroke="#4a2535" stroke-width="1.2"/>
  <line x1="1016" y1="46" x2="1019" y2="39" stroke="#4a2535" stroke-width="1.3"/>
  <line x1="1136" y1="45" x2="1138" y2="39" stroke="#3d1f2c" stroke-width="1.2"/>

  <!-- CENTRAL SKULL -->
  <g transform="translate(600,30)">
    <!-- Crown spikes -->
    <path d="M -8,-18 C -10,-30 -17,-33 -15,-24" stroke="#6a3548" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M  8,-18 C  10,-30  17,-33  15,-24" stroke="#6a3548" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M  0,-20 L 0,-30" stroke="#5a2f40" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="0" cy="-30" r="2.2" fill="#6a3548"/>
    <circle cx="-15" cy="-24" r="2" fill="#5a2f40"/>
    <circle cx="15"  cy="-24" r="2" fill="#5a2f40"/>

    <!-- Skull drop shadow -->
    <ellipse cx="2" cy="4" rx="19" ry="22" fill="#100808" opacity="0.6"/>

    <!-- Skull body -->
    <path d="M 0,-21 C -7,-24 -18,-20 -20,-12 C -22,-5 -19,7 -13,15 L -8,19 L 8,19 L 13,15 C 19,7 22,-5 20,-12 C 18,-20 7,-24 0,-21 Z" fill="#cdc8a6"/>

    <!-- Upper darker zone -->
    <path d="M 0,-21 C -7,-24 -18,-20 -20,-12 C -14,-17 -7,-19 0,-18 C 7,-19 14,-17 20,-12 C 18,-20 7,-24 0,-21 Z" fill="#aaa590"/>

    <!-- Left eye socket -->
    <ellipse cx="-7" cy="-5" rx="5.5" ry="4.2" fill="#100808" transform="rotate(-6,-7,-5)"/>
    <!-- Right eye socket -->
    <ellipse cx="7"  cy="-5" rx="5.5" ry="4.2" fill="#100808" transform="rotate(6,7,-5)"/>

    <!-- Pupils (crimson) -->
    <circle cx="-7" cy="-5" r="2.2" fill="#c03535"/>
    <circle cx="7"  cy="-5" r="2.2" fill="#c03535"/>

    <!-- Nose -->
    <ellipse cx="0" cy="5" rx="2.2" ry="3" fill="#100808"/>

    <!-- Mouth -->
    <path d="M -6,11 Q 0,8 6,11 Q 5,16 0,17 Q -5,16 -6,11 Z" fill="#100808"/>

    <!-- X suture on forehead -->
    <line x1="-6" y1="-16" x2="6" y2="-8" stroke="#9a9070" stroke-width="1.2" opacity="0.9"/>
    <line x1="6"  y1="-16" x2="-6" y2="-8" stroke="#9a9070" stroke-width="1.2" opacity="0.9"/>

    <!-- Jaw hatch marks -->
    <line x1="-12" y1="13" x2="-16" y2="19" stroke="#9a9070" stroke-width="1" opacity="0.6"/>
    <line x1="12"  y1="13" x2="16"  y2="19" stroke="#9a9070" stroke-width="1" opacity="0.6"/>

    <!-- Inner flanking diamonds on main track -->
    <polygon points="-26,-1 -21,-4 -26,-7 -31,-4" fill="#5a2f40"/>
    <polygon points=" 26,-1  31,-4  26,-7  21,-4" fill="#5a2f40"/>
  </g>
</svg>
