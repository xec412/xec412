<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60">
  <defs>
    <linearGradient id="lnL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#333333" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#808080" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#909090" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="lnR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#909090" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#808080" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#333333" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lnLt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1a1a1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#505050" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="lnRt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#505050" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8e8e8" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#f4f4f4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c0c0c0" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="60" fill="#060608"/>

  <line x1="0"   y1="30" x2="520"  y2="30" stroke="url(#lnL)"  stroke-width="1.5"/>
  <line x1="680" y1="30" x2="1200" y2="30" stroke="url(#lnR)"  stroke-width="1.5"/>
  <line x1="0"   y1="23" x2="505"  y2="23" stroke="url(#lnLt)" stroke-width="0.7"/>
  <line x1="695" y1="23" x2="1200" y2="23" stroke="url(#lnRt)" stroke-width="0.7"/>
  <line x1="0"   y1="37" x2="505"  y2="37" stroke="url(#lnLt)" stroke-width="0.7"/>
  <line x1="695" y1="37" x2="1200" y2="37" stroke="url(#lnRt)" stroke-width="0.7"/>

  <!-- Katana centered at 600,30 — blade points left, handle points right -->
  <g transform="translate(600,30)">
    <!-- Blade body -->
    <path d="M -255,0 C -190,-0.9 -90,0.4 -15,1.6 L 38,2.8 L 38,-2.8 L -15,-1.6 C -90,-0.4 -190,0.9 -255,0"
          fill="url(#bladeGrad)" opacity="0.95"/>
    <!-- Blade shine -->
    <path d="M -252,0.4 C -175,-0.4 -70,0.9 38,1.6"
          fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.55"/>
    <!-- Mune (back edge) -->
    <path d="M -252,-0.4 C -175,0.4 -70,-0.6 38,-1.4"
          fill="none" stroke="#aaaaaa" stroke-width="0.4" opacity="0.35"/>

    <!-- Tsuba (guard) -->
    <ellipse cx="38" cy="0" rx="5" ry="14" fill="#363636" stroke="#888888" stroke-width="1"/>
    <ellipse cx="38" cy="0" rx="3" ry="9"  fill="none" stroke="#606060" stroke-width="0.6" opacity="0.5"/>

    <!-- Tsuka (handle) -->
    <path d="M 38,-5.5 C 60,-5.5 82,-4 90,0 C 82,4 60,5.5 38,5.5 Z"
          fill="#1e1e1e" stroke="#585858" stroke-width="0.7"/>
    <!-- Ito wrap -->
    <line x1="50" y1="-5.2" x2="48" y2="5.2" stroke="#424242" stroke-width="1.1" opacity="0.85"/>
    <line x1="61" y1="-5.4" x2="59" y2="5.4" stroke="#424242" stroke-width="1.1" opacity="0.85"/>
    <line x1="72" y1="-5.2" x2="70" y2="5.2" stroke="#424242" stroke-width="1.1" opacity="0.85"/>
    <line x1="82" y1="-4.5" x2="80" y2="4.5" stroke="#424242" stroke-width="1.1" opacity="0.85"/>

    <!-- Kashira (pommel) -->
    <ellipse cx="91" cy="0" rx="4.5" ry="6.5" fill="#282828" stroke="#747474" stroke-width="0.8"/>
    <ellipse cx="91" cy="0" rx="2.5" ry="4"   fill="none" stroke="#4a4a4a" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Left shard decorations -->
  <g transform="translate(440,30)">
    <polygon points="0,-9 5.5,0 0,9 -5.5,0" fill="#b0b0b0" opacity="0.75"/>
    <polygon points="0,-5.5 3.2,0 0,5.5 -3.2,0" fill="none" stroke="#d8d8d8" stroke-width="0.5" opacity="0.5"/>
    <circle r="1.2" fill="#e0e0e0" opacity="0.6"/>
  </g>
  <g transform="translate(305,30)">
    <polygon points="0,-7 4,0 0,7 -4,0" fill="#909090" opacity="0.6"/>
    <circle r="0.9" fill="#c0c0c0" opacity="0.5"/>
  </g>
  <g transform="translate(185,30)">
    <polygon points="0,-5 3,0 0,5 -3,0" fill="#686868" opacity="0.5"/>
  </g>
  <g transform="translate(85,30)">
    <polygon points="0,-3.5 2,0 0,3.5 -2,0" fill="#4a4a4a" opacity="0.4"/>
  </g>

  <!-- Right shard decorations (mirrored) -->
  <g transform="translate(760,30)">
    <polygon points="0,-9 5.5,0 0,9 -5.5,0" fill="#b0b0b0" opacity="0.75"/>
    <polygon points="0,-5.5 3.2,0 0,5.5 -3.2,0" fill="none" stroke="#d8d8d8" stroke-width="0.5" opacity="0.5"/>
    <circle r="1.2" fill="#e0e0e0" opacity="0.6"/>
  </g>
  <g transform="translate(895,30)">
    <polygon points="0,-7 4,0 0,7 -4,0" fill="#909090" opacity="0.6"/>
    <circle r="0.9" fill="#c0c0c0" opacity="0.5"/>
  </g>
  <g transform="translate(1015,30)">
    <polygon points="0,-5 3,0 0,5 -3,0" fill="#686868" opacity="0.5"/>
  </g>
  <g transform="translate(1115,30)">
    <polygon points="0,-3.5 2,0 0,3.5 -2,0" fill="#4a4a4a" opacity="0.4"/>
  </g>
</svg>
